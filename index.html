<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta content="IE=edge" http-equiv="X-UA-Compatible"/>
<meta name="referrer" content="no-referrer"/>
<!-- Custom-element upgrade race (see docs/superpowers/specs/2026-07-11-passkey-ui-m3e-design.md
     "Cold-load upgrade race"): m3e-theme only gets display:contents from
     its own shadow styles once Lit registers it. Pin the pre-upgrade
     state to match, so SocialCalc's boot-time layout math never measures
     against a corrupted inline-box layout. -->
<style>m3e-theme:not(:defined) { display: contents; }</style>
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
<link rel="icon" type="image/png" href="./favicon-32x32.png" sizes="32x32">
<link rel="icon" type="image/png" href="./favicon-16x16.png" sizes="16x16">
<link rel="manifest" href="./manifest.json">
<link rel="mask-icon" href="./safari-pinned-tab.svg" color="#0c3159">
<meta name="apple-mobile-web-app-title" content="Ethercalc">
<meta name="application-name" content="Ethercalc">
<meta name="theme-color" content="#0c3159">
<base target="_blank"/>
<title>EtherCalc - Share the URL to your friends and edit together!</title>
<script src="./static/index-bootstrap.js"></script>
<script src="./static/jquery.js"></script>
<script src="./static/socialcalc.js"></script>
<script type="module" src="./static/passkey/ui.js"></script>
<script type="module" src="./static/player.js"></script>
<script src="./static/index-l10n.js"></script>

<link rel="stylesheet" type="text/css" href="./static/socialcalc.css">
<link rel="stylesheet" type="text/css" href="./static/index.css">
<link rel="stylesheet" type="text/css" href="./static/passkey/ui.css">
<link rel="stylesheet" type="text/css" href="./static/jquery-ui.min.css">
<style>
body
 {font-family:verdana,helvetica,sans-serif;font-size:small;}
.testclass {border:2px dotted red;}
.testclass2 {background-image:url(/images/sc-logo.gif);}
.smaller {font-size:smaller;}
.hide {display:none;}
</style>
<link rel="stylesheet" type="text/css" href="./static/makeup.css">
<script src="./static/makeup.js"></script>
</head>
<body>
<m3e-theme color="#0c3159" scheme="light" variant="expressive" motion="expressive">
<div id="msg" style="position:absolute;right:15px;top: 8px; bottom: 80px; display: none">
<textarea id="msgtext" style="margin-top:10px;width:110px;height:100%;"></textarea><br>
<form id="msgform">
<input type="text" id="msgout" name="msgout" style="width: 110px">
<br>
<input type="submit" style="font-size:x-small;" value="Add a line"><br>
</form>
</div>
<div id="tableeditor">&nbsp;<div class="loader"></div></div>
</m3e-theme>
</body>
</html>
