name = "ethercalc"
main = "src/index.ts"
compatibility_date = "2026-07-21"
compatibility_flags = ["nodejs_compat"]

# Disable the `*.workers.dev` hostname for production (L-14). It serves the
# identical Worker but lives OUTSIDE the `ethercalc.net` zone, so any zone-
# scoped WAF / Rate Limiting rules (the whole §13 Q7 abuse-prevention plan)
# do NOT apply to it — an attacker could hit the workers.dev URL and bypass
# every rate-limit. With this false, only the zone-protected custom domains
# below serve traffic. Migration tooling must target the custom domain
# (https://ethercalc.net) rather than the old workers.dev URL.
workers_dev = false

# Custom domains. Requires the `ethercalc.net` zone to live under this
# Cloudflare account (one-time nameserver swap at the registrar). On
# deploy, wrangler auto-creates proxied DNS records and provisions TLS.
# `override_existing_dns_record = true` replaces the legacy A/CNAME
# records (2026-04-22 cutover from Zappa/Node to this worker).
[[routes]]
pattern = "ethercalc.net"
zone_name = "ethercalc.net"
custom_domain = true
[[routes]]
pattern = "www.ethercalc.net"
zone_name = "ethercalc.net"
custom_domain = true
# Durable Object: one instance per spreadsheet room.
# Holds live SocialCalc state, WebSocket clients, and the snapshot/log/audit
# storage. See AGENTS.md §3.2 and §3.3.
[[durable_objects.bindings]]
name = "ROOM"
class_name = "RoomDO"

# Phase A — singleton AuthDO: WebAuthn credentials, challenges, and the
# session-signing secret. Addressed only as `idFromName('auth')`.
[[durable_objects.bindings]]
name = "AUTH"
class_name = "AuthDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDO"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["AuthDO"]

# Default vars — overridden per-deploy by `wrangler secret put` or
# wrangler.toml overlays. `ETHERCALC_KEY` is unset by default (anonymous
# mode / identity HMAC); production deploys should run
# `wrangler secret put ETHERCALC_KEY` instead of committing a value.
# `BASEPATH` is empty by default (legacy `--basepath` CLI flag).
#
# §13 Q6: the CLI (`bin/ethercalc --key …`, Phase 11) will also set
# ETHERCALC_KEY in the Miniflare env for self-host parity.
[vars]
BASEPATH = ""
ETHERCALC_CORS = "1"
# Phase A — passkey auth. `ETHERCALC_AUTH` is the master switch for the
# `/_auth/*` ceremonies and the private-room routes. The RP ID / origin
# are WebAuthn trust anchors: they MUST match the site users visit.
# NOTE: WebAuthn origins are exact. The Worker redirects the configured
# origin's `www` alias to this naked origin before starting any ceremony.
ETHERCALC_AUTH = "1"
ETHERCALC_RP_ID = "ethercalc.net"
ETHERCALC_RP_NAME = "EtherCalc"
ETHERCALC_ORIGIN = "https://ethercalc.net"

# Staging overlay — isolated from production routes and cron triggers. It uses
# its own D1 database and a temporary workers.dev hostname for release checks.
[env.staging]
name = "ethercalc-staging"
workers_dev = true
preview_urls = true
routes = []

[env.staging.vars]
BASEPATH = ""
ETHERCALC_CORS = "1"
# Phase A — passkey auth is live on staging for the WebAuthn acceptance test.
# RP ID / origin MUST match the workers.dev hostname exactly.
ETHERCALC_AUTH = "1"
ETHERCALC_RP_ID = "ethercalc-staging.audreyt.workers.dev"
ETHERCALC_RP_NAME = "EtherCalc Staging"
ETHERCALC_ORIGIN = "https://ethercalc-staging.audreyt.workers.dev"

[[env.staging.durable_objects.bindings]]
name = "ROOM"
class_name = "RoomDO"

[[env.staging.durable_objects.bindings]]
name = "AUTH"
class_name = "AuthDO"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "ethercalc_rooms_staging"
database_id = "273b1db3-17bc-44dd-bbc2-62ce1727abde"
migrations_dir = "./migrations"

[env.staging.assets]
directory = "../../assets"
binding = "ASSETS"
run_worker_first = true

[env.staging.triggers]
crons = []

# Workers Assets binding (Phase 4.1/11). `directory` is resolved relative
# to this wrangler.toml, so it points up two levels to the repo-root
# `assets/` produced by `scripts/build-assets.ts`. That builder copies the
# curated set of static files (index.html, start.html, panels.html,
# icons, manifest.appcache, manifest.json, l10n/*.json, the built
# single-sheet client at static/player.js, the SocialCalc runtime at
# static/socialcalc.js, and the multi-sheet React app under multi/).
#
# The legacy repo root contains `node_modules/` and other >25 MiB files
# that trip Workers' per-asset size limit, so we point at the curated
# directory instead of `./`. Also `assets/` is .gitignored — CI rebuilds
# it before `wrangler deploy --dry-run`.
#
# Runtime fallback: when `ASSETS` is unbound (test env), the route layer
# at `src/routes/assets.ts` returns 404. Integration tests stub the
# binding with a mock Fetcher to exercise the proxied path.
[assets]
directory = "../../assets"
binding = "ASSETS"
run_worker_first = true

# Phase 9 — Cron Trigger. Cloudflare invokes `scheduled()` every minute.
# The legacy HTTP trigger remains only for self-host operators and requires
# `Authorization: Bearer $ETHERCALC_MIGRATE_TOKEN`.
[triggers]
crons = ["*/1 * * * *"]

# Cloudflare Email Service binding. Commented out by default because sender
# domain onboarding and explicit recipient policy are deployment-specific.
# Spreadsheet content can schedule mail, so production bindings MUST restrict
# both sender and destination addresses rather than expose account-wide quota.
# The structured `EMAIL.send({from: {email},to,subject,text})` call is
# implemented in `src/lib/email.ts`; unbound deployments report email disabled.
#
# [[send_email]]
# name = "EMAIL"
# allowed_sender_addresses = ["noreply@example.com"]
# allowed_destination_addresses = ["alerts@example.com"]

# KV, R2 bindings will be added in subsequent phases as they are used.
# Scaffolding them eagerly would force empty bindings into the local
# Miniflare state and muddy the test environment.

# D1 — cross-room index mirror (Phase 5.1). DO storage is the
# authoritative source of truth for a single room; this table provides
# the cross-room query surface needed by `/_rooms`, `/_roomlinks`,
# `/_roomtimes`. Mirror writes land in `src/room.ts` after every
# snapshot mutation; reads in `src/routes/rooms.ts` fall back to empty
# when the binding is absent (Node unit tests without Miniflare).
#
# Binding name is `DB`. Schema at `migrations/0001_rooms.sql`. The
# `database_id` placeholder is fine for local Miniflare and `wrangler
# deploy --dry-run` — a real id is required only for an actual
# `wrangler deploy`. See §10.2 for the Redis → D1 mapping table.
[[d1_databases]]
binding = "DB"
database_name = "ethercalc_rooms"
database_id = "bd9247bd-5b50-4c47-8ce6-de3196511684"
migrations_dir = "./migrations"

# Load SocialCalc.js as a Text module so `new Function(rawSource)` inside
# `@ethercalc/socialcalc-headless` can eval it. The `?raw` Vite suffix
# handles this under vitest-pool-workers (Vite resolves it directly);
# wrangler's esbuild bundler needs an explicit rule, otherwise it tries
# to parse the 27k-line UMD (sloppy-mode `delete varname;` that esbuild
# rejects in strict ESM).
#
# Important: this rule is only consumed by `wrangler deploy`. The
# `vitest.config.ts` sets its miniflare options directly (no `wrangler:
# { configPath }`) so this rule doesn't leak into the vitest runner and
# mangle `?raw` imports with `?mf_vitest_force=Text`.
[[rules]]
type = "Text"
globs = ["**/SocialCalc.js?raw", "**/SocialCalc.js"]
fallthrough = true

# `unsafe_eval` binding is no longer needed: `socialcalc.bundled.ts` is
# transpiled at build time into the worker bundle (see
# `packages/socialcalc-headless/scripts/build.js`). No runtime `eval` /
# `new Function` calls remain, so CF validation no longer needs the
# capability object. If we ever revert to `?raw`-import + eval, re-add:
#
#   [[unsafe.bindings]]
#   name = "UNSAFE_EVAL"
#   type = "unsafe_eval"