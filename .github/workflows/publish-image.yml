name: Publish Docker image

# On each version tag (`0.YYYYMMDD.N`), build the self-host image multi-arch
# (amd64 + arm64) and push to Docker Hub as `audreyt/ethercalc:<tag>` and
# `audreyt/ethercalc:latest`. Also wires a manual `workflow_dispatch` so a
# run can be triggered against any ref for testing.
#
# Requires the following repo secrets:
#   - DOCKERHUB_USERNAME
#   - DOCKERHUB_TOKEN   (a Docker Hub access token with Read, Write, Delete)

on:
  push:
    tags:
      - '0.2*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to publish (defaults to "dev")'
        required: false
        default: 'dev'

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: container-publish
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Derive image tags
        id: tags
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME}"
            tags="audreyt/ethercalc:${version},audreyt/ethercalc:latest"
          else
            version="${INPUT_TAG:-dev}"
            tags="audreyt/ethercalc:${version}"
          fi
          if [[ ! "$version" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Invalid Docker tag" >&2
            exit 1
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (for arm64 on an amd64 runner)
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
