name: Publish npm package

# On each version tag (e.g. `0.YYYYMMDD.N`), runs full checks, builds assets,
# packs deterministic archives, and publishes to the npm registry using OIDC
# Trusted Publishing (no static secrets).
#
# Prerequisite: Configure Trusted Publishing for the package "ethercalc" on
# npmjs.com with the following OIDC settings:
#   - Owner: audreyt
#   - Repository: ethercalc
#   - Workflow: publish-npm.yml
#   - Environment: npm-publish

on:
  push:
    tags:
      - '0.2*.*'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "PUBLISH" to override dry-run and publish to npm'
        required: false
        default: 'dry-run'

concurrency:
  group: publish-npm-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: run checks + pack candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tarball-path: ${{ steps.pack.outputs.tarball-path }}
      tarball-name: ${{ steps.pack.outputs.tarball-name }}
      version: ${{ steps.pack.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # voidzero-dev/setup-vp v1.1.0
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@e1609b468742ba9232ce5e12b3a77bdf14495277
        with:
          cache: true

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Typecheck
        run: vp run typecheck

      - name: Lint
        run: vp check


      - name: Run full test suite
        run: vp run test

      - name: Pack and verify deterministic package contract
        id: pack
        run: |
          set -euo pipefail
          mkdir -p dist-release

          VERSION="$(node -p "require('./package.json').version")"
          if [[ ! "$VERSION" =~ ^[0-9A-Za-z][0-9A-Za-z._-]{0,127}$ ]]; then
            echo "::error::Unsafe package version"
            exit 1
          fi
          TARBALL_NAME="ethercalc-${VERSION}.tgz"

          # Pack twice and verify byte-for-byte identity (reproducibility check)
          vp pm pack --out dist-release/pack1.tgz
          vp pm pack --out dist-release/pack2.tgz

          SHA1="$(sha256sum dist-release/pack1.tgz | awk '{print $1}')"
          SHA2="$(sha256sum dist-release/pack2.tgz | awk '{print $1}')"

          if [ "$SHA1" != "$SHA2" ]; then
            echo "::error::Package is non-deterministic: pack1 sha256=$SHA1, pack2 sha256=$SHA2"
            exit 1
          fi

          mv dist-release/pack1.tgz "dist-release/$TARBALL_NAME"
          rm -f dist-release/pack2.tgz

          # Extract and assert no test, e2e, or Stryker files leaked
          mkdir -p /tmp/pack-verify-extract
          tar -xzf "dist-release/$TARBALL_NAME" -C /tmp/pack-verify-extract

          FORBIDDEN=(
            "package/packages/e2e"
            "package/packages/oracle-harness"
            "package/.stryker-tmp"
            "package/stryker-setup"
          )
          for path in "${FORBIDDEN[@]}"; do
            if [ -e "/tmp/pack-verify-extract/$path" ]; then
              echo "::error::Forbidden path leaked into npm package: $path"
              exit 1
            fi
          done

          PACKED_VERSION="$(node -p "require('/tmp/pack-verify-extract/package/package.json').version")"
          if [ "$PACKED_VERSION" != "$VERSION" ]; then
            echo "::error::Packed package version mismatch"
            exit 1
          fi

          {
            echo "tarball-path=./dist-release/$TARBALL_NAME"
            echo "tarball-name=$TARBALL_NAME"
            echo "version=$VERSION"
          } >> "$GITHUB_OUTPUT"
          
          # Archive the build artifact for the publish job
          mkdir -p /tmp/artifact-sharing
          cp "dist-release/$TARBALL_NAME" /tmp/artifact-sharing/
          
      - name: Upload release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: npm-release-tarball
          path: dist-release/
          retention-days: 7
          if-no-files-found: error

  publish:
    name: npm OIDC publish
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm-publish
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download release artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: npm-release-tarball
          path: dist-release

      - name: Setup Node.js (required for npm OIDC publish)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 'lts/*'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish to npm
        # If triggered by a version tag push, or manual workflow_dispatch with confirm=PUBLISH, publish the package.
        # Otherwise, run a dry-run check. Expression values enter through env,
        # never shell source, and the validated build output pins the filename.
        env:
          CONFIRM_INPUT: ${{ github.event.inputs.confirm }}
          EVENT_NAME: ${{ github.event_name }}
          TARBALL: ${{ needs.validate.outputs.tarball-path }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$TARBALL" =~ ^\./dist-release/ethercalc-[0-9A-Za-z._-]+\.tgz$ ]] || [ ! -f "$TARBALL" ]; then
            echo "Invalid release artifact path" >&2
            exit 1
          fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$CONFIRM_INPUT" != "PUBLISH" ]; then
            echo "Dry-run mode: verifying package signature only."
            npm publish "$TARBALL" --provenance --dry-run
          else
            echo "Publishing version $VERSION to npm..."
            npm publish "$TARBALL" --provenance
          fi
